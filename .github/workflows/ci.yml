name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: local
      DATABASE_URL: postgresql://ci:ci@localhost:5432/lumen
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      TRUST_PROXY_HEADERS: "false"
      AUTH_PROVIDER: local
      AI_PROVIDER: mock
      EMAIL_PROVIDER: log
      PADDLE_ENVIRONMENT: sandbox
      NEXT_PUBLIC_PADDLE_ENVIRONMENT: sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
